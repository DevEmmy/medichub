# One-click deploy on Render: Dashboard › New › Blueprint › pick this repo.
# You'll be asked for the secret values marked sync: false.
services:
  - type: web
    name: medichub
    runtime: docker
    plan: free             # sleeps when idle; switch to starter to keep it awake
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # paste your PostgreSQL URL (Neon / Render Postgres / Supabase)
      - key: ADMIN_EMAIL
        sync: false          # first reviewer account, e.g. medichubnigeria@gmail.com
      - key: ADMIN_PASSWORD
        sync: false          # 10+ characters; change it after first sign-in
      - key: APP_URL
        sync: false          # where people open the app, e.g. https://devemmy.github.io/medichub/
      - key: ALLOWED_ORIGINS
        sync: false          # https://devemmy.github.io when the website stays on GitHub Pages
      - key: BREVO_API_KEY
        sync: false          # free email (300/day) – works on Render's free plan; set MAIL_FROM too
      - key: SMTP_USER
        sync: false          # Gmail address (only on paid Render: the free plan blocks email ports)
      - key: SMTP_PASS
        sync: false          # Gmail app password
      - key: RESEND_API_KEY
        sync: false          # emails: password resets, status reminders, weekly reports
      - key: MAIL_FROM
        sync: false          # the sender, e.g. Medic Hub <medichubng@gmail.com> (verified in Brevo)
      - key: PAYSTACK_SECRET_KEY
        sync: false          # online payments: sk_test_… to try, sk_live_… to go live (dashboard.paystack.com › Settings › API Keys)
      - key: PLATFORM_FEE_PERCENT
        value: "0"           # Medic Hub's share of each booking payment (0 = hospital gets everything)
      - key: ANTHROPIC_API_KEY
        sync: false          # Medic AI answers (optional)
      - key: AI_API_KEY
        sync: false          # or a free Groq key instead of Anthropic (optional)
      - key: AT_USERNAME
        sync: false          # Africa's Talking username ("sandbox" to test) for USSD + SMS (optional)
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false          # optional registered sender name
      - key: PHONE_WEBHOOK_KEY
        sync: false          # optional secret added as ?key= to the USSD/SMS callback URLs
