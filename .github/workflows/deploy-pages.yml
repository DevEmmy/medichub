# Builds the app and publishes it to the gh-pages branch on every push to main.
# Without the MEDICHUB_API_URL variable it is the browser-only demo; with it, the site talks to the live server.
# GitHub Pages (Settings → Pages → Deploy from a branch → gh-pages / root) then serves it.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # No live server yet: publish the self-contained demo (data stays in each visitor's browser).
      - name: Build demo
        if: ${{ vars.MEDICHUB_API_URL == '' }}
        run: npm run build
      # Live server set (Settings → Secrets and variables → Actions → Variables → MEDICHUB_API_URL):
      # the site uses the real database, real accounts, emails and SMS.
      - name: Build live site
        if: ${{ vars.MEDICHUB_API_URL != '' }}
        run: npx tsc -b && npx vite build --outDir dist
        env:
          VITE_BACKEND: '1'
          VITE_API_URL: ${{ vars.MEDICHUB_API_URL }}
          VITE_USSD_CODE: ${{ vars.MEDICHUB_USSD_CODE }}
          VITE_SMS_NUMBER: ${{ vars.MEDICHUB_SMS_NUMBER }}
      - run: touch dist/.nojekyll
      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
